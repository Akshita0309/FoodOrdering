
services:
  db:
    image: mysql:8.0
    container_name: foodexpress-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: foodapp
      MYSQL_USER: capstone
      MYSQL_PASSWORD: casptone123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "capstone", "-pcasptone123"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - foodexpress-net

  backend:
    build: ./backend
    container_name: foodexpress-backend
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/foodapp?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=capstone
      - SPRING_DATASOURCE_PASSWORD=casptone123
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=com.mysql.cj.jdbc.Driver
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.MySQLDialect
      - JWT_SECRET=foodexpress-super-secret-key-change-this-in-production-min-256-bits
      - MAIL_HOST=${MAIL_HOST:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_FROM=${MAIL_FROM:-no-reply@foodexpress.local}
      - JAVA_OPTS=-Xmx512m
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8083/api-docs"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - foodexpress-net

  frontend:
    build: ./frontend
    container_name: foodexpress-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - foodexpress-net

networks:
  foodexpress-net:
    driver: bridge

volumes:
  mysql_data:
