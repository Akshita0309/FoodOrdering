spring.application.name=justeat-backend
server.port=8083
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# MySQL database
spring.datasource.url=${JUSTEAT_DB_URL:${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/foodapp?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
spring.datasource.username=${JUSTEAT_DB_USERNAME:${SPRING_DATASOURCE_USERNAME:root}}
spring.datasource.password=${JUSTEAT_DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:root}}
spring.datasource.driver-class-name=${JUSTEAT_DB_DRIVER_CLASS_NAME:${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT
jwt.secret=${JWT_SECRET:justeat-super-secret-key-change-this-in-production-min-256-bits-long}
jwt.expiration=${JWT_EXPIRATION:86400000}

# SMTP / Email (used for password reset codes)
# Set these via environment variables in production — do not commit real credentials.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:${APP_MAIL_FROM:no-reply@justeat.local}}}


# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Logging
logging.level.com.justeat=INFO
logging.level.org.springframework.security=WARN
